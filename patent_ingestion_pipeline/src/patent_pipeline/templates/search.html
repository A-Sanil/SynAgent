<!doctype html>
<html>
<head><meta charset="utf-8"><title>Search</title></head>
<body>
  <h1>Search results for '{{ q }}'</h1>
  <h2>Patents</h2>
  <ul>
  {% for p in patents %}
    <li><a href="/patent/{{ p['patent_id'] }}">{{ p['title'] or p['patent_id'] }}</a></li>
  {% endfor %}
  </ul>
  <h2>Reactions</h2>
  <ul>
  {% for r in reactions %}
    <li>{{ r['reaction_id'] }} (patent: <a href="/patent/{{ r['patent_id'] }}">{{ r['patent_id'] }}</a>)</li>
  {% endfor %}
  </ul>
  <a href="/">Back</a>
</body>
</html>
