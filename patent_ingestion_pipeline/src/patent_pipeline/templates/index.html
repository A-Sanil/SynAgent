<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Patent Parser - Review</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script defer src="/static/app.js"></script>
</head>
<body>
  <h1>Patent Parser - Review Queue</h1>
  <p class="small" id="storage-status">Connecting to database…</p>
  <p><a href="/batch_review">Batch review (low confidence)</a> • <a href="/status">API status</a></p>
  <form method="get" action="/search">
    <input name="q" placeholder="Search patents or reactions">
    <button type="submit">Search</button>
  </form>
  <form method="post" action="/enqueue_all">
    <button type="submit">Enqueue All Raw Documents</button>
  </form>
  <div class="header card" style="margin-top:12px;align-items:center;">
    <div class="brand"><span class="logo"></span><div><h1>Patent Parser</h1><div class="small">Review queue</div></div></div>
    <div class="controls">
      <input type="search" placeholder="Search..." onkeypress="if(event.key==='Enter'){location.href='/search?q='+this.value}">
      <button class="btn" id="run-worker-btn" type="button">Run Worker (1 job)</button>
    </div>
  </div>
  <table border="1" cellpadding="6">
    <thead><tr><th>Patents</th><th>Reviewed</th></tr></thead>
    <tbody>
    {% for p in patents %}
      <tr class="card patent-item">
        <td><a href="/patent/{{ p['patent_id'] }}">{{ p['title'] or p['patent_id'] }}</a><div class="small">{{ p['patent_id'] }}</div></td>
        <td style="text-align:right"><div class="small">{{ 'Reviewed' if p['reviewed'] else 'Pending' }}</div></td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
</body>
</html>
